        <path id="path34"
          d="m 348.983,326.208 h 5.681 v -5.605 h -5.681 z m -6.862,-6.79 h 5.682 v -5.605 h -5.682 z m 6.862,13.579 h 5.681 v -5.606 h -5.681 z m -6.862,0 h 5.682 v -5.606 h -5.682 z"
          style="fill:#231f20;fill-opacity:1;fill-rule:nonzero;stroke:none"
          transform="matrix(1.3333333,0,0,-1.3333333,0,793.70133)"
          clip-path="url(#clipPath35)" />
      </g>
    </g>
  </svg>

  <script>
  (function () {
    const group = document.getElementById('group-MC0');
    const pathEls = Array.from(group.querySelectorAll('path'));
    const allDots = [];

    function tokenize(d) {
      const tokens = [];
      const re = /[mMhHvVzZ]|[-+]?(?:\d+\.?\d*|\.\d+)(?:[eE][-+]?\d+)?/g;
      const src = d.replace(/,/g, ' ');
      let m;
      while ((m = re.exec(src)) !== null) tokens.push(m[0]);
      return tokens;
    }

    function parseSubPaths(d) {
      const result = [];
      const tokens = tokenize(d);
      let x = 0, y = 0, sx = 0, sy = 0;
      let first = true, cur = null;
      let i = 0;

      while (i < tokens.length) {
        const t = tokens[i];
        if (!/[mMhHvVzZ]/.test(t)) { i++; continue; }
        i++;
        switch (t) {
          case 'm': {
            const dx = +tokens[i++], dy = +tokens[i++];
            x = first ? dx : sx + dx;
            y = first ? dy : sy + dy;
            sx = x; sy = y; first = false;
            cur = ['M ' + x.toFixed(4) + ',' + y.toFixed(4)];
            break;
          }
          case 'M': {
            x = +tokens[i++]; y = +tokens[i++];
            sx = x; sy = y; first = false;
            cur = ['M ' + x.toFixed(4) + ',' + y.toFixed(4)];
            break;
          }
          case 'h': { const dx = +tokens[i++]; x += dx; if (cur) cur.push('h ' + dx); break; }
          case 'H': { x = +tokens[i++]; if (cur) cur.push('H ' + x); break; }
          case 'v': { const dy = +tokens[i++]; y += dy; if (cur) cur.push('v ' + dy); break; }
          case 'V': { y = +tokens[i++]; if (cur) cur.push('V ' + y); break; }
          case 'z': case 'Z': {
            if (cur) { cur.push('z'); result.push(cur.join(' ')); cur = null; }
            x = sx; y = sy;
            break;
          }
        }
      }
      if (cur) result.push(cur.join(' '));
      return result;
    }

    pathEls.forEach(function (pathEl) {
      const d         = pathEl.getAttribute('d');
      const transform = pathEl.getAttribute('transform');
      const clip      = pathEl.getAttribute('clip-path');
      const subs      = parseSubPaths(d);

      subs.forEach(function (subD) {
        const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        p.setAttribute('d', subD);
        if (transform) p.setAttribute('transform', transform);
        if (clip)      p.setAttribute('clip-path', clip);
        p.setAttribute('fill', '#ffffff');
        p.setAttribute('fill-rule', 'nonzero');
        p.setAttribute('stroke', 'none');
        p.style.opacity    = '0.07';
        p.style.transition = 'opacity 70ms ease-out';
        group.appendChild(p);
        allDots.push(p);
      });

      pathEl.remove();
    });

    /* Fisher-Yates shuffle */
    for (let i = allDots.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const tmp = allDots[i]; allDots[i] = allDots[j]; allDots[j] = tmp;
    }

    /* Schedule: slow start → accelerates → all lit by 2.5 s */
    const TOTAL    = 1500;
    const FADE_DUR = 1000;
    const n        = allDots.length;
    const EXP      = 2.8;

    allDots.forEach(function (dot, idx) {
      const progress = n > 1 ? idx / (n - 1) : 1;
      const t = Math.round((1 - Math.pow(1 - progress, EXP)) * TOTAL);
      setTimeout(function () { dot.style.opacity = '1'; }, t);
    });

    /* After all dots are lit, fade the whole logo out */
    setTimeout(function () {
      const svg = document.getElementById('svg1');
      svg.style.transition = 'opacity ' + FADE_DUR + 'ms ease-in-out';
      svg.style.opacity = '0';
    }, TOTAL + 3000);
  })();
  </script>
</body>
